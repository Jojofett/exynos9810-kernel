name: DS-ACK Kernel Build Test

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fix Submodule Configuration
        run: |
          if [ -f .gitmodules ]; then
            echo "Checking .gitmodules configuration..."
            if grep -q 'KernelSU-Next' .gitmodules; then
              echo "Found KernelSU-Next in .gitmodules, checking URL..."
              sed -i '/\[submodule "KernelSU-Next"\]/,/^\[/d' .gitmodules
            fi
          fi

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y zstd git gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          python-dev-is-python3 bsdiff wget clang clang-tools gcc lld

      - name: Download and Extract Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/../compiler
          echo "Downloading Clang r522817..."
          curl -Lo clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz
          echo "Extracting toolchain..."
          tar -xzf clang.tar.gz -C $GITHUB_WORKSPACE/../compiler
          
          # Vereinfachte Logik
          mkdir -p $GITHUB_WORKSPACE/../compiler/clang-18.0.1-r522817
          if [ "$(ls -A $GITHUB_WORKSPACE/../compiler)" ]; then
              mv $GITHUB_WORKSPACE/../compiler/* $GITHUB_WORKSPACE/../compiler/clang-18.0.1-r522817/ 2>/dev/null || true
          fi
          
          if [ -f "$GITHUB_WORKSPACE/../compiler/clang-18.0.1-r522817/bin/ld.lld" ]; then
            echo "Toolchain ready"
            chmod +x $GITHUB_WORKSPACE/../compiler/clang-18.0.1-r522817/bin/*
          else
            echo "ERROR: Toolchain setup failed"
            exit 1
          fi
          rm clang.tar.gz

      - name: Set up Build Environment
        run: |
          touch buildtools
          chmod +x apollo.sh

      - name: Execute Build Script (Versuch 1)
        id: build_step
        continue-on-error: true
        run: |
          # Versuch 1: Standard-Build (was bereits funktioniert hat)
          printf "1\n3\n1\nn\ny\ny" | ./apollo.sh

      - name: Check If ZIP Created
        run: |
          if find . -name "*.zip" -type f | grep -q .; then
            echo "ZIP files found, good!"
          else
            echo "No ZIP files found, checking for IMG..."
            if find . -name "*.img" -type f | grep -q .; then
              echo "IMG files found, will create ZIP manually"
              echo "CREATE_ZIP=true" >> $GITHUB_ENV
            fi
          fi

      - name: Create ZIP from IMG if needed
        if: env.CREATE_ZIP == 'true'
        run: |
          echo "Creating ZIP files from IMG files..."
          cd Apollo/Product
          for img_file in *.img; do
            if [ -f "$img_file" ]; then
              echo "Creating ZIP for $img_file"
              zip_name="${img_file%.img}.zip"
              # Einfache ZIP nur mit dem Image
              zip "$zip_name" "$img_file"
              echo "Created: $zip_name"
            fi
          done
          cd ../..
          ls -la Apollo/Product/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Builds
          path: |
            Apollo/Product/*
          if-no-files-found: error
