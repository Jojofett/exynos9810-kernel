name: DS-ACK Kernel Build Test

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fix Submodule Configuration
        run: |
          if [ -f .gitmodules ]; then
            echo "Checking .gitmodules configuration..."
            if grep -q 'KernelSU-Next' .gitmodules; then
              echo "Found KernelSU-Next in .gitmodules, checking URL..."
              sed -i '/\[submodule "KernelSU-Next"\]/,/^\[/d' .gitmodules
            fi
          fi

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y zstd git gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          python-dev-is-python3 bsdiff wget clang clang-tools gcc lld

      - name: Download and Extract Clang Toolchain
        run: |
          # Erstelle das Compiler-Verzeichnis, wo apollo.sh es erwartet
          mkdir -p $GITHUB_WORKSPACE/../compiler
          
          # Lade die r522817 Toolchain herunter
          echo "Downloading Clang r522817..."
          curl -Lo clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r522817/clang-r522817.tar.gz
          
          # Entpacke mit tar (gzip-Format)
          echo "Extracting toolchain..."
          tar -xzf clang.tar.gz -C $GITHUB_WORKSPACE/../compiler
          
          # Zeige den Inhalt des Verzeichnisses für Debugging
          echo "Contents after extraction:"
          ls -la $GITHUB_WORKSPACE/../compiler/
          
          # Überprüfe, ob das erwartete Verzeichnis existiert
          if [ -d "$GITHUB_WORKSPACE/../compiler/clang-r522817" ]; then
              # Wenn ja: umbenennen
              mv $GITHUB_WORKSPACE/../compiler/clang-r522817 $GITHUB_WORKSPACE/../compiler/clang-18.0.1-r522817
              echo "Renaming successful: clang-r522817 -> clang-18.0.1-r522817"
          else
              # Wenn nicht: erstelle das Verzeichnis und verschiebe alle Dateien
              echo "clang-r522817 directory not found. Creating it..."
              mkdir -p $GITHUB_WORKSPACE/../compiler/clang-18.0.1-r522817
              # Verschiebe alle Dateien aus compiler/ in das neue Verzeichnis
              if [ "$(ls -A $GITHUB_WORKSPACE/../compiler)" ]; then
                  mv $GITHUB_WORKSPACE/../compiler/* $GITHUB_WORKSPACE/../compiler/clang-18.0.1-r522817/ 2>/dev/null || true
                  echo "Files moved to clang-18.0.1-r522817"
              fi
          fi
          
          # Überprüfe ob die Binärdateien existieren
          if [ -f "$GITHUB_WORKSPACE/../compiler/clang-18.0.1-r522817/bin/ld.lld" ]; then
            echo "Verification Success: ld.lld found."
            chmod +x $GITHUB_WORKSPACE/../compiler/clang-18.0.1-r522817/bin/*
          else
            echo "ERROR: ld.lld not found in extracted directory!"
            echo "Contents of toolchain directory:"
            find $GITHUB_WORKSPACE/../compiler/clang-18.0.1-r522817 -type f | head -20
            exit 1
          fi
          
          rm clang.tar.gz

      - name: Set up Build Environment
        run: |
          # Create the "READY" file to skip the interactive first-time setup sudo prompt
          touch buildtools
          chmod +x apollo.sh

      - name: Execute Build Script (Interactive Bypass)
        run: |
          # Simulation sequence:
          # 7 -> Build All/ZIP
          # 3 -> Select Clang 18 (uses clang-r522817 folder)
          # 1 -> Selinux Permissive
          # n -> NO KernelSU
          # y -> Clean Build
          # y -> Build Flashable ZIP
          printf "7\n3\n1\nn\ny\ny" | ./apollo.sh

      - name: Check Generated Files
        run: |
          echo "=== CHECKING GENERATED FILES ==="
          echo "Current directory: $(pwd)"
          echo "Directory structure:"
          ls -la
          
          echo "--- Apollo directory ---"
          ls -la Apollo/ || echo "Apollo directory not found"
          
          echo "--- Apollo/Product directory ---"
          ls -la Apollo/Product/ || echo "Apollo/Product directory not found"
          
          echo "--- All ZIP files in repository ---"
          find . -name "*.zip" -type f 2>/dev/null
          
          echo "--- Build output directory contents ---"
          ls -la arch/arm64/boot/ || echo "arch/arm64/boot/ not found"

      - name: Upload Compiled Zips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Kernel-Zips
          # Suche nach ZIP-Dateien in verschiedenen möglichen Pfaden
          path: |
            Apollo/Product/*.zip
            *.zip
            **/*.zip
          if-no-files-found: warn
          compression-level: 6
