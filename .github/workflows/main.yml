name: Build Kernel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # ------------------------------------------------------------------
    # 1. FIX SUBMODULES (especially KernelSU-Next if missing URL)
    # ------------------------------------------------------------------
    - name: Repair KernelSU-Next submodule
      run: |
        # If the directory exists but is not a proper git repo, remove it
        if [ -d "KernelSU-Next" ] && [ ! -f "KernelSU-Next/.git" ]; then
          echo "Removing invalid KernelSU-Next directory"
          rm -rf KernelSU-Next
        fi
        # If .gitmodules references KernelSU-Next but has no URL, add a default (change to your actual URL)
        if grep -q "KernelSU-Next" .gitmodules 2>/dev/null; then
          if ! git config --file .gitmodules submodule.KernelSU-Next.url > /dev/null; then
            echo "Adding missing URL for KernelSU-Next submodule"
            git config --file .gitmodules submodule.KernelSU-Next.url https://github.com/Jojofett/KernelSU-Next.git
          fi
        fi
        git submodule sync --recursive
        git submodule update --init --recursive --force

    # ------------------------------------------------------------------
    # 2. INSTALL DEPENDENCIES & TOOLCHAINS
    # ------------------------------------------------------------------
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev unzip python3 python3-pip

    - name: Install cross-compilers
      run: |
        # AArch64 (kernel) – provides aarch64-linux-gnu-ld.bfd
        sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
        # ARM 32-bit (for uH, if needed)
        sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-kernel

    # ------------------------------------------------------------------
    # 3. BUILD uH FIRMWARE (if source present)
    #    Assumes uH source is in init/uh/ – adjust path if different.
    # ------------------------------------------------------------------
    - name: Build uh.elf
      run: |
        UH_SOURCE_DIR="init/uh"   # <-- change if your uH source is elsewhere
        if [ -f "$UH_SOURCE_DIR/Makefile" ]; then
          echo "Building uH firmware from $UH_SOURCE_DIR"
          make -C "$UH_SOURCE_DIR" CROSS_COMPILE=arm-none-eabi- CC=arm-none-eabi-gcc
          # Locate the generated uh.elf (may be in build/ subfolder)
          UH_ELF=$(find "$UH_SOURCE_DIR" -name "uh.elf" | head -1)
          if [ -n "$UH_ELF" ]; then
            cp "$UH_ELF" init/
            echo "uh.elf copied to init/"
          else
            echo "ERROR: uh.elf not generated. Check uH build logs."
            exit 1
          fi
        else
          echo "No uH source found at $UH_SOURCE_DIR. If uh.elf is required, ensure it is prebuilt."
          if [ ! -f "init/uh.elf" ] && grep -q 'incbin.*uh.elf' init/_uh.S; then
            echo "WARNING: init/uh.elf is missing. Creating a dummy file to satisfy the build."
            touch init/uh.elf
          fi
        fi

    # ------------------------------------------------------------------
    # 4. SET KERNEL BUILD ENVIRONMENT
    #    Use GNU BFD linker (ld.bfd) to avoid vDSO errors with ld.lld.
    # ------------------------------------------------------------------
    - name: Set build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        # Explicitly use GNU BFD linker (safe for Samsung kernels)
        echo "LD=aarch64-linux-gnu-ld.bfd" >> $GITHUB_ENV
        # Enable ccache
        echo "/usr/lib/ccache" >> $GITHUB_PATH

    - name: Clean build directory
      run: make clean && make mrproper

    # ------------------------------------------------------------------
    # 5. GENERATE DEFCONFIG – REPLACE WITH YOUR ACTUAL TARGET
    #    Check arch/arm64/configs/ for the correct name (e.g., exynos9810_defconfig, a71_defconfig, etc.)
    # ------------------------------------------------------------------
    - name: Generate defconfig
      run: make exynos9810_defconfig   # <-- CHANGE THIS

    # ------------------------------------------------------------------
    # 6. DISABLE RKP (to fix rkp_ro_alloc_phys errors)
    # ------------------------------------------------------------------
    - name: Disable RKP
      run: |
        scripts/config --file .config --undefine CONFIG_RKP
        scripts/config --file .config --undefine CONFIG_SAMSUNG_RKP
        scripts/config --file .config --set-val CONFIG_RKP n
        make olddefconfig

    # ------------------------------------------------------------------
    # 7. BUILD KERNEL IMAGE
    #    Change the target (Image, zImage, Image.gz) based on your kernel.
    # ------------------------------------------------------------------
    - name: Build kernel
      run: |
        make -j$(nproc) Image   # <-- CHANGE if needed (e.g., zImage)

    # ------------------------------------------------------------------
    # 8. LOCATE AND PACKAGE KERNEL IMAGE
    # ------------------------------------------------------------------
    - name: Check build artifacts
      run: |
        mkdir -p Apollo/Product
        if [ -f "arch/arm64/boot/Image" ]; then
          cp arch/arm64/boot/Image Apollo/Product/kernel.img
        elif [ -f "arch/arm64/boot/Image.gz" ]; then
          cp arch/arm64/boot/Image.gz Apollo/Product/kernel.img
        elif [ -f "arch/arm64/boot/zImage" ]; then
          cp arch/arm64/boot/zImage Apollo/Product/kernel.img
        else
          echo "ERROR: No kernel image found!"
          find . -name "*.img" -o -name "Image*" -o -name "zImage" | head -20
          exit 1
        fi

    - name: Package kernel
      run: |
        cd Apollo/Product
        zip_name="DS-ACK-Kernel-$(date +%Y%m%d-%H%M%S).zip"
        zip -q "$zip_name" kernel.img
        echo "Created $zip_name"
        cd ../..

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: Apollo/Product/*.zip

    - name: Upload build logs (if any)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs
        path: |
          build.log
          config.log
          scripts/config.log
